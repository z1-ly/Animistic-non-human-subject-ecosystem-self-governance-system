server:
  port: 8080

spring:
  application:
    name: wanwu-sovereignty
  datasource:
    url: jdbc:mysql://localhost:3306/ecovoice_main?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

sandbox:
  simulation:
    enabled: true
    interval-ms: 60000
  insight:
    enabled: true
    interval-ms: 120000
